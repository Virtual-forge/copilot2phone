[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlink-sim"
version = "0.1.0"
description = "AgentLink simulator: a terminal stand-in for the phone"
requires-python = ">=3.11"
dependencies = [
    "agentd",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
agentlink-sim = "agentlink_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
